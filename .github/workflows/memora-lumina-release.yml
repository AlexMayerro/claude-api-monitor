name: Build Memora Lumina (Windows)

on:
  push:
    tags:
      - 'memora-lumina-v*'
    branches:
      - 'claude/build-memora-lumina-**'
    paths:
      - 'memora-lumina/**'
      - '.github/workflows/memora-lumina-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer + portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: memora-lumina
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: memora-lumina/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package Windows (NSIS installer + portable + zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable zip --publish never

      - name: List release artifacts
        run: ls -lh release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memora-lumina-windows
          path: |
            memora-lumina/release/*.exe
            memora-lumina/release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag or main branch build)
        if: startsWith(github.ref, 'refs/tags/memora-lumina-v') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/claude/build-memora-lumina')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('memora-lumina-build-{0}', github.run_number) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('memora-lumina-build-{0}', github.run_number) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: |
            memora-lumina/release/*.exe
            memora-lumina/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
